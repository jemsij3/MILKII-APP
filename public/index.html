<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MILKII APP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-2: #eef1eb;
      --text: #18211b;
      --text-muted: #5a685e;
      --border: #dce2da;
      --primary: #1f7a4d;
      --primary-hover: #18623d;
      --primary-soft: #e3f2ea;
      --yellow: #ffd54a;
      --yellow-text: #1c1906;
      --danger: #c62828;
      --danger-soft: #fdecea;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
      --radius: 14px;
      --radius-sm: 10px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121714;
        --surface: #1b221e;
        --surface-2: #242d28;
        --text: #eef3ef;
        --text-muted: #9eb0a3;
        --border: #2e3933;
        --primary: #2ca368;
        --primary-hover: #35b977;
        --primary-soft: #1a3527;
        --yellow: #ffd54a;
        --yellow-text: #191605;
        --danger: #ef5350;
        --danger-soft: #3a1a1a;
        --warn: #fbbf24;
        --warn-soft: #3a2d12;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      }
    }

    html[data-theme="light"] {
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-2: #eef1eb;
      --text: #18211b;
      --text-muted: #5a685e;
      --border: #dce2da;
      --primary: #1f7a4d;
      --primary-hover: #18623d;
      --primary-soft: #e3f2ea;
      --yellow: #ffd54a;
      --yellow-text: #1c1906;
      --danger: #c62828;
      --danger-soft: #fdecea;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
    }

    html[data-theme="dark"] {
      --bg: #121714;
      --surface: #1b221e;
      --surface-2: #242d28;
      --text: #eef3ef;
      --text-muted: #9eb0a3;
      --border: #2e3933;
      --primary: #2ca368;
      --primary-hover: #35b977;
      --primary-soft: #1a3527;
      --yellow: #ffd54a;
      --yellow-text: #191605;
      --danger: #ef5350;
      --danger-soft: #3a1a1a;
      --warn: #fbbf24;
      --warn-soft: #3a2d12;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    .gate-message {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }

    .app-shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding-bottom: calc(92px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--primary);
    }

    .lang-select {
      min-height: 44px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-weight: 600;
      font-size: 13px;
    }

    .nav-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-bar::-webkit-scrollbar { display: none; }

    .nav-btn {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .search-wrap {
      padding: 12px 14px 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 12px;
      box-shadow: var(--shadow);
    }

    .search-input {
      width: 100%;
      min-height: 46px;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 15px;
    }

    .clear-search {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .loc-filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px 14px 2px;
    }

    .loc-select,
    .loc-input {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      outline: 0;
    }

    .loc-select:focus,
    .loc-input:focus {
      border-color: var(--primary);
    }

    .chips-wrap {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      scrollbar-width: none;
    }
    .chips-wrap::-webkit-scrollbar { display: none; }

    .chip {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .content {
      padding: 6px 14px 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-emoji {
      font-size: 46px;
    }

    .badge-star {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--yellow);
      color: var(--yellow-text);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .badge-play {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.68);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .price-tag {
      display: inline-block;
      align-self: flex-start;
      background: var(--yellow);
      color: var(--yellow-text);
      font-weight: 800;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 7px;
      margin-bottom: 2px;
    }

    .card-title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-region {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-summary {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: auto;
      padding-top: 2px;
    }

    .fab-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      padding: 10px 14px calc(12px + var(--safe-bottom));
      background: linear-gradient(to top, var(--bg) 70%, rgba(0, 0, 0, 0));
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    .fab-btn {
      pointer-events: auto;
      width: 100%;
      max-width: 532px;
      min-height: 50px;
      border: 0;
      border-radius: var(--radius);
      background: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(31, 122, 77, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .fab-btn:active {
      background: var(--primary-hover);
    }

    .btn {
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-warn {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: var(--warn);
    }

    .btn-sm {
      min-height: 44px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .state-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .state-box .emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .backdrop.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      overflow-y: auto;
      padding: 14px 16px calc(20px + var(--safe-bottom));
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.25);
    }

    .sheet-handle {
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: var(--border);
      margin: 0 auto 12px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .gallery-wrap {
      position: relative;
      margin: 0 -16px 12px;
      background: #000;
    }

    .gallery-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .gallery-track::-webkit-scrollbar { display: none; }

    .gallery-slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 360px;
      min-height: 240px;
      background: #111;
    }

    .gallery-slide img,
    .gallery-slide video {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      display: block;
    }

    .gallery-count {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .detail-price-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .detail-price {
      background: var(--yellow);
      color: var(--yellow-text);
      font-weight: 800;
      font-size: 18px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .neg-badge {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 800;
      margin: 4px 0;
    }

    .detail-place {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .detail-desc {
      white-space: pre-wrap;
      background: var(--surface-2);
      padding: 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      font-size: 14px;
    }

    .details-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .details-table th,
    .details-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .details-table th {
      color: var(--text-muted);
      font-weight: 600;
      width: 44%;
    }

    .translate-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 14px;
    }

    .translate-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .translate-result {
      margin-top: 10px;
      padding: 10px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      font-size: 14px;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-row > .btn {
      flex: 1 1 120px;
    }

    .wizard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .wizard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .step-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .notice-box {
      background: var(--warn-soft);
      color: var(--warn);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .info-box {
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .cat-picker {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .cat-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      min-height: 68px;
    }

    .cat-option.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .cat-option-emoji {
      font-size: 32px;
      flex-shrink: 0;
    }

    .cat-option-title {
      font-weight: 800;
      font-size: 15px;
    }

    .cat-option-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .req {
      color: var(--danger);
      margin-left: 3px;
    }

    .char-count {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      outline: 0;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
    }

    .textarea {
      min-height: 96px;
      resize: vertical;
    }

    .field-error {
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }

    .quick-places {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .quick-place-btn {
      min-height: 44px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .multi-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .check-pill {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .media-counters {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 13px;
    }

    .media-counter {
      background: var(--surface-2);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .media-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface-2);
      border: 2px solid var(--border);
    }

    .media-tile.cover {
      border-color: var(--primary);
    }

    .media-tile img,
    .media-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 32px;
      min-height: 32px;
      border-radius: 999px;
      border: 0;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .media-cover-tag {
      position: absolute;
      left: 4px;
      bottom: 4px;
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .media-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 11px;
      padding: 4px;
      text-align: center;
    }

    .plan-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 70px;
    }

    .plan-card.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .plan-price {
      background: var(--yellow);
      color: var(--yellow-text);
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .pay-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin: 12px 0;
    }

    .pay-account-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 6px 0;
    }

    .receipt-preview {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
      object-fit: contain;
    }

    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .row-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .row-thumb {
      width: 68px;
      height: 68px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface-2);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      overflow: hidden;
    }

    .row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .row-info {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-weight: 800;
      font-size: 15px;
      word-break: break-word;
    }

    .row-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      word-break: break-word;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .st-pending { background: var(--warn-soft); color: var(--warn); }
    .st-approved { background: var(--primary-soft); color: var(--primary); }
    .st-rejected { background: var(--danger-soft); color: var(--danger); }
    .st-sold { background: var(--surface-2); color: var(--text-muted); }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .chat-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 220px);
      min-height: 360px;
      overflow: hidden;
    }

    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 14px;
      white-space: pre-wrap;
      font-size: 14px;
      word-break: break-word;
    }

    .bubble-user {
      align-self: flex-end;
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble-ai {
      align-self: flex-start;
      background: var(--surface-2);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .dialog-card {
      width: 92%;
      max-width: 440px;
      margin: auto;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: #1b221e;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      max-width: 90%;
      text-align: center;
      display: none;
    }

    .toast.show {
      display: block;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .chart-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .chart-axis {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .hbar-row {
      margin-bottom: 8px;
    }

    .hbar-label-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .hbar-track {
      height: 10px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .hbar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .user-badge-banned {
      display: inline-block;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }

        return {

      function loadSavedItems() {
        try {
          const raw = localStorage.getItem("milkii_saved");
          const parsed = JSON.parse(raw || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }

      function persistSavedItems() {
        try {
          localStorage.setItem("milkii_saved", JSON.stringify(state.saved));
        } catch {}
      }

      function t(key, vars) {
        const dict = I18N[state.lang] || I18N.en;
        let str = dict[key] || I18N.en[key] || key;
        if (vars) {
          for (const k of Object.keys(vars)) {
            str = str.replace(new RegExp("\\{" + k + "\\}", "g"), String(vars[k]));
          }
        }
        return str;
      }

      function lval(obj) {
        if (!obj) return "";
        if (typeof obj === "string") return obj;
        return obj[state.lang] || obj.en || "";
      }

      function esc(str) {
        return String(str === null || str === undefined ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatPrice(n) {
        return Number(n || 0).toLocaleString("en-US") + " " + t("birr");
      }

      function getRegions() {
        return state.config && Array.isArray(state.config.regions) ? state.config.regions : [];
      }

      function getRegionObj(regionVal) {
        return getRegions().find((r) => r.v === regionVal) || null;
      }

      function getRegionLabel(regionVal) {
        const reg = getRegionObj(regionVal);
        return reg ? lval(reg) : String(regionVal || "");
      }

      function formatItemLocation(it) {
        const regLabel = it.region ? getRegionLabel(it.region) : "";
        const parts = [];
        if (it.city) parts.push(it.city);
        if (it.place) parts.push(it.place);
        if (regLabel) parts.push(regLabel);
        return parts.join(", ");

      let toastTimer = null;

        el.classList.add("show");

        toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
      }

      async function api(path, options = {}) {
        const headers = Object.assign({}, options.headers || {}, {
          "X-Init-Data": initData,
          "X-Lang": state.lang
        });
        if (options.body && !(options.body instanceof FormData) && !headers["Content-Type"]) {
          headers["Content-Type"] = "application/json";
        }
        const res = await fetch(path, Object.assign({}, options, { headers }));
        const ct = res.headers.get("content-type") || "";
        if (ct.includes("application/json")) {
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || "Request failed");
          }
          return data;
        }
        if (!res.ok) {
          throw new Error("Request failed");
        }
        return res;
      }

      function cloudThumbUrl(id) {
        const cloud = state.config ? state.config.cloud_name : "";
        return `https://res.cloudinary.com/${encodeURIComponent(cloud)}/image/upload/c_fill,w_400,h_400,q_auto,f_auto/${id}`;
      }

      function cloudFullUrl(id) {
        const cloud = state.config ? state.config.cloud_name : "";
        return `https://res.cloudinary.com/${encodeURIComponent(cloud)}/image/upload/w_1000,q_auto,f_auto/${id}`;
      }

      function cloudVideoUrl(id) {
        const cloud = state.config ? state.config.cloud_name : "";

      }

      function cloudVideoPosterUrl(id) {
        const cloud = state.config ? state.config.cloud_name : "";
        return `https://res.cloudinary.com/${encodeURIComponent(cloud)}/video/upload/so_0,w_800,c_fill,h_800/${id}.jpg`;
      }

      function getCoverImage(media) {
        if (!Array.isArray(media)) return null;
        return media.find((m) => m && m.type === "image") || null;
      }

      function hasVideoMedia(media) {
        return Array.isArray(media) && media.some((m) => m && m.type === "video");
      }

      function getOptionText(field, val) {
        if (!field || !Array.isArray(field.options)) return String(val || "");
        const opt = field.options.find((o) => o.v === val);
        return opt ? lval(opt) : String(val || "");
      }

      function formatFieldValue(catKey, field, rawVal) {
        if (rawVal === undefined || rawVal === null || rawVal === "") return "";
        if (field.type === "select") {
          return getOptionText(field, rawVal);
        }
        if (field.type === "multiselect" && Array.isArray(rawVal)) {
          return rawVal.map((v) => getOptionText(field, v)).join(", ");
        }
        return String(rawVal);
      }

      function getCardSummary(item) {
        const cat = state.config && state.config.categories[item.cat];
        if (!cat || !Array.isArray(cat.card)) return "";
        const attrs = item.attrs || {};
        const parts = [];
        for (const key of cat.card) {
          const field = cat.fields.find((f) => f.key === key);
          if (!field) continue;
          const val = attrs[key];
          if (val === undefined || val === null || val === "") continue;
          if (item.cat === "food" && key === "quantity") {
            const unitField = cat.fields.find((f) => f.key === "unit");
            const unitTxt = unitField && attrs.unit ? getOptionText(unitField, attrs.unit) : "";
            parts.push(`${val}${unitTxt ? " " + unitTxt : ""}`);
          } else {
            parts.push(formatFieldValue(item.cat, field, val));
          }
        }
        return parts.join(" · ");
      }

      function isSaved(id) {
        return state.saved.some((s) => s.id === id);
      }

      function toggleSave(item) {
        const idx = state.saved.findIndex((s) => s.id === item.id);
        if (idx >= 0) {
          state.saved.splice(idx, 1);
        } else {
          state.saved.unshift(item);
        }
        persistSavedItems();
      }

      function syncSavedWithLive() {
        const byId = new Map(state.items.map((it) => [it.id, it]));
        state.saved = state.saved.map((s) => byId.get(s.id) || s);
        persistSavedItems();
      }

      function itemMatchesFilters(item) {
        if (state.catFilter !== "all" && item.cat !== state.catFilter) return false;
        if (state.regionFilter && item.region !== state.regionFilter) return false;
        const cityNeedle = state.cityFilter.trim().toLowerCase();
        if (cityNeedle) {
          const itemCity = String(item.city || "").toLowerCase();
          if (!itemCity.includes(cityNeedle)) return false;
        }
        const q = state.search.trim().toLowerCase();
        if (!q) return true;

        const cat = state.config && state.config.categories[item.cat];
        const parts = [
          item.title,
          item.desc,
          item.region,
          getRegionLabel(item.region),
          item.city,
          item.place,
          cat ? lval(cat.label) : ""
        ];
        const attrs = item.attrs || {};
        if (cat) {
          for (const f of cat.fields) {
            const v = attrs[f.key];
            if (v !== undefined && v !== null) {
              parts.push(Array.isArray(v) ? v.join(" ") : String(v));
              parts.push(formatFieldValue(item.cat, f, v));
            }
          }
        } else {
          parts.push(JSON.stringify(attrs));
        }
        return parts.join(" ").toLowerCase().includes(q);
      }

      function renderBarChartSvg(rows, valueKey, titleText, totalText) {
        if (!Array.isArray(rows) || rows.length === 0) {
          return `
            <div class="chart-card">
              <div class="chart-head">
                <strong>${esc(titleText)}</strong>
                <span class="chart-meta">${esc(totalText)}</span>
              </div>
              <div style="color:var(--text-muted);font-size:13px;">${esc(t("chartNoData"))}</div>
            </div>
          `;
        }
        const vals = rows.map((r) => Number(r[valueKey] || 0));
        const maxVal = Math.max(1, ...vals);
        const w = 320;
        const h = 110;
        const padBottom = 18;
        const plotH = h - padBottom - 8;
        const step = w / rows.length;
        const barW = Math.max(2, step - (rows.length > 35 ? 1 : 2));
        const bars = rows
          .map((r, i) => {
            const v = Number(r[valueKey] || 0);
            const barH = v > 0 ? Math.max(2, Math.round((v / maxVal) * plotH)) : 0;
            const x = Number((i * step + (step - barW) / 2).toFixed(2));
            const y = h - padBottom - barH;
            return `<rect x="${x}" y="${y}" width="${barW.toFixed(2)}" height="${barH}" rx="1.5" fill="var(--primary)"><title>${esc(r.day)}: ${esc(v)}</title></rect>`;
          })
          .join("");
        const firstDay = rows[0]?.day || "";
        const lastDay = rows[rows.length - 1]?.day || "";
        return `
          <div class="chart-card">
            <div class="chart-head">
              <strong>${esc(titleText)}</strong>
              <span class="chart-meta">${esc(totalText)} · Max ${esc(maxVal.toLocaleString("en-US"))}</span>
            </div>
            <svg viewBox="0 0 ${w} ${h}" width="100%" height="120" role="img" aria-label="${esc(titleText)}">
              <line x1="0" y1="${h - padBottom}" x2="${w}" y2="${h - padBottom}" stroke="var(--border)" stroke-width="1" />
              ${bars}
              <text x="0" y="${h - 4}" font-size="9" fill="var(--text-muted)">${esc(firstDay)}</text>
              <text x="${w}" y="${h - 4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${esc(lastDay)}</text>
            </svg>
          </div>
        `;
      }

      function renderHorizontalBars(titleText, rows, getLabel, getRightText, getCount) {
        if (!Array.isArray(rows) || rows.length === 0) {
          return `
            <div class="chart-card">
              <div class="chart-head"><strong>${esc(titleText)}</strong></div>

                    <button type="button" class="cat-option${p.cat === key ? " selected" : ""}" data-pick-cat="${esc(key)}">
                      <span class="cat-option-emoji">${esc(c.emoji)}</span>
                      <div>
                        <div class="cat-option-title">${esc(lval(c.label))}</div>

        } else if (p.step === 2) {

          bodyHtml = `
            <h3 style="margin:0 0 8px;">${esc(t("step2Title"))}</h3>
            <div class="info-box">${esc(t("step2Desc"))}</div>
            <div class="media-counters">
              <span class="media-counter">${esc(t("photosCount", { n: photoItems.length }))}</span>

            </div>
            <div class="action-row">
              <label class="btn btn-primary" style="position:relative;overflow:hidden;">
                📷 ${esc(t("addPhotos"))}

              </label>
              <label class="btn" style="position:relative;overflow:hidden;">
                🎥 ${esc(t("addVideo"))}
                <input id="videoPicker" type="file" accept="video/mp4,video/quicktime,video/webm" style="display:none;" ${videoItems.length >= 1 ? "disabled" : ""} />
              </label>
            </div>
            <div class="media-grid">
              ${p.media
                .map((m, idx) => {
                  const firstImgIdx = p.media.findIndex((x) => x.type === "image");
                  const isCover = m.type === "image" && idx === firstImgIdx;
                  return `
                    <div class="media-tile${isCover ? " cover" : ""}" data-make-cover="${esc(m.uid)}">
                      ${
                        m.type === "image"
                          ? `<img src="${esc(m.previewUrl)}" alt="" />`
                          : `<video src="${esc(m.previewUrl)}" muted playsinline></video>`
                      }
                      <button type="button" class="media-remove" data-remove-media="${esc(m.uid)}" aria-label="Remove">✕</button>
                      ${isCover ? `<span class="media-cover-tag">${esc(t("coverTag"))}</span>` : ""}
                      ${
                        m.status === "uploading" || m.status === "queued"
                          ? `<div class="media-progress">${esc(t("uploading"))} ${esc(m.progress)}%</div>`

                          ? `<div class="media-progress" style="background:rgba(198,40,40,0.9);cursor:pointer;" data-retry-media="${esc(m.uid)}">${esc(t("failedRetry"))}</div>`

                      }
                    </div>
                  `;

                .join("")}
            </div>

        } else if (p.step === 3 && cat) {
          const priceLbl = p.cat === "services" ? t("startingPrice") : t("priceLabel");
          const username = state.me && state.me.username ? "@" + state.me.username : "";
          const selectedRegionObj = getRegionObj(p.region);
          const citySuggestions = selectedRegionObj && Array.isArray(selectedRegionObj.cities)

          const catFieldsHtml = cat.fields
            .map((f) => {

              const errMsg = p.errors["attr_" + f.key];
              const reqMark = f.required ? `<span class="req">*</span>` : "";
              let inputHtml = "";

              if (f.type === "select") {
                inputHtml = `
                  <select class="select" data-attr-input="${esc(f.key)}">
                    <option value="">--</option>
                    ${f.options
                      .map(
                        (o) =>
                          `<option value="${esc(o.v)}"${val === o.v ? " selected" : ""}>${esc(lval(o))}</option>`
                      )
                      .join("")}
                  </select>
                `;
              } else if (f.type === "multiselect") {
                const arr = Array.isArray(val) ? val : [];
                inputHtml = `
                  <div class="multi-checks">
                    ${f.options
                      .map((o) => {
                        const checked = arr.includes(o.v);
                        return `
                          <label class="check-pill">
                            <input type="checkbox" data-attr-multi="${esc(f.key)}" value="${esc(o.v)}"${checked ? " checked" : ""} />
                            <span>${esc(lval(o))}</span>
                          </label>
                        `;
                      })
                      .join("")}
                  </div>
                `;
              } else if (f.type === "number") {
                inputHtml = `
                  <input class="input" type="number" data-attr-input="${esc(f.key)}"
                    value="${esc(val !== undefined && val !== null ? val : "")}"
                    ${f.min !== undefined ? `min="${esc(f.min)}"` : ""}
                    ${f.max !== undefined ? `max="${esc(f.max)}"` : ""}
                    placeholder="${esc(lval(f.placeholder))}" />
                `;
              } else if (f.type === "date") {
                inputHtml = `
                  <input class="input" type="date" data-attr-input="${esc(f.key)}"
                    value="${esc(val || "")}" />
                `;
              } else {
                const maxLen = f.maxLength || 60;
                const curLen = typeof val === "string" ? val.length : 0;
                inputHtml = `
                  <input class="input" type="text" data-attr-input="${esc(f.key)}"
                    value="${esc(val || "")}"
                    maxlength="${esc(maxLen)}"
                    placeholder="${esc(lval(f.placeholder))}" />
                `;
                return `
                  <div class="field-group">
                    <label class="field-label">
                      <span>${esc(lval(f.label))}${reqMark}</span>
                      <span class="char-count">${curLen}/${maxLen}</span>
                    </label>
                    ${inputHtml}
                    ${errMsg ? `<div class="field-error">${esc(errMsg)}</div>` : ""}
                  </div>
                `;
              }

              return `
                <div class="field-group">
                  <label class="field-label"><span>${esc(lval(f.label))}${reqMark}</span></label>
                  ${inputHtml}
                  ${errMsg ? `<div class="field-error">${esc(errMsg)}</div>` : ""}
                </div>
              `;
            })
            .join("");

          bodyHtml = `
            <h3 style="margin:0 0 12px;">${esc(t("step3Title"))}</h3>
            ${!username ? `<div class="notice-box">${esc(t("noTgUsername"))}</div>` : ""}
            ${catFieldsHtml}
            <hr style="border:0;border-top:1px solid var(--border);margin:14px 0;" />
            <div class="field-group">
              <label class="field-label">
                <span>${esc(t("regionLabel"))}<span class="req">*</span></span>
              </label>
              <select id="fRegion" class="select">
                <option value="">${esc(t("selectRegionOption"))}</option>
                ${regions
                  .map(
                    (r) =>
                      `<option value="${esc(r.v)}"${p.region === r.v ? " selected" : ""}>${esc(lval(r))}</option>`
                  )
                  .join("")}
              </select>
              ${p.errors.region ? `<div class="field-error">${esc(p.errors.region)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="field-label">
                <span>${esc(t("cityLabel"))}<span class="req">*</span></span>
                <span class="char-count" id="cityCount">${p.city.length}/40</span>
              </label>
              <input id="fCity" class="input" type="text" maxlength="40" value="${esc(p.city)}" placeholder="${esc(t("cityPlaceholder"))}" />
              ${
                citySuggestions.length
                  ? `<div class="quick-places">
                      ${citySuggestions
                        .map(
                          (c) => `<button type="button" class="quick-place-btn" data-pick-city="${esc(c)}">${esc(c)}</button>`
                        )
                        .join("")}
                    </div>`
                  : ""
              }
              ${p.errors.city ? `<div class="field-error">${esc(p.errors.city)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="field-label">
                <span>${esc(t("placeLabel"))}</span>
                <span class="char-count" id="placeCount">${p.place.length}/40</span>
              </label>
              <input id="fPlace" class="input" type="text" maxlength="40" value="${esc(p.place)}" placeholder="${esc(t("placePlaceholder"))}" />
              ${p.errors.place ? `<div class="field-error">${esc(p.errors.place)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="field-label">
                <span>${esc(t("titleLabel"))}<span class="req">*</span></span>
                <span class="char-count" id="titleCount">${p.title.length}/60</span>
              </label>
              <input id="fTitle" class="input" type="text" maxlength="60" value="${esc(p.title)}" placeholder="${esc(lval(cat.titlePlaceholder))}" />
              ${p.errors.title ? `<div class="field-error">${esc(p.errors.title)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="field-label"><span>${esc(priceLbl)}<span class="req">*</span></span></label>
              <input id="fPrice" class="input" type="number" min="0" max="100000000" step="1" value="${esc(p.price)}" placeholder="0" />
              ${p.errors.price ? `<div class="field-error">${esc(p.errors.price)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="check-pill">
                <input id="fNegotiable" type="checkbox"${p.negotiable ? " checked" : ""} />
                <span>${esc(t("negotiableLabel"))}</span>
              </label>
            </div>
            <div class="field-group">
              <label class="field-label">
                <span>${esc(t("descLabel"))}<span class="req">*</span></span>
                <span class="char-count" id="descCount">${p.desc.length}/300</span>
              </label>
              <textarea id="fDesc" class="textarea" maxlength="300">${esc(p.desc)}</textarea>
              ${p.errors.desc ? `<div class="field-error">${esc(p.errors.desc)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="field-label"><span>${esc(t("sellerTgLabel"))}</span></label>
              <input class="input" type="text" value="${esc(username || "-")}" readonly style="background:var(--surface-2);color:var(--text-muted);" />
            </div>
          `;
        } else if (p.step === 4) {
          const planRows = [
            { id: "free", title: t("planFree"), desc: t("planFreeDesc"), fee: Number(plans.free || 0) },
            { id: "standard", title: t("planStandard"), desc: t("planStandardDesc"), fee: Number(plans.standard || 0) },
            { id: "featured", title: t("planFeatured"), desc: t("planFeaturedDesc"), fee: Number(plans.featured || 0) }
          ];
          bodyHtml = `
            <h3 style="margin:0 0 12px;">${esc(t("step4Title"))}</h3>
            ${planRows
              .map(
                (pl) => `
                  <div class="plan-card${p.plan === pl.id ? " selected" : ""}" data-pick-plan="${esc(pl.id)}">
                    <div>
                      <div style="font-weight:800;font-size:15px;">${esc(pl.title)}</div>
                      <div style="font-size:13px;color:var(--text-muted);">${esc(pl.desc)}</div>
                    </div>
                    <div class="plan-price">${esc(pl.fee)} ${esc(t("birr"))}</div>
                  </div>
                `
              )
              .join("")}
          `;
        } else if (p.step === 5) {
          const fee = Number(plans[p.plan] || 0);
          const payCfg = (state.config && state.config.payment) || {};
          const pm = payCfg[p.payMethod] || payCfg.CBE || { label: p.payMethod, number: "-", holder: "-" };
          bodyHtml = `
            <h3 style="margin:0 0 12px;">${esc(t("step5Title"))}</h3>
            <div class="field-group">
              <label class="field-label"><span>${esc(t("chooseMethod"))}<span class="req">*</span></span></label>
              <div class="action-row">
                <button type="button" class="btn${p.payMethod === "CBE" ? " btn-primary" : ""}" data-pay-method="CBE">CBE</button>
                <button type="button" class="btn${p.payMethod === "Telebirr" ? " btn-primary" : ""}" data-pay-method="Telebirr">Telebirr</button>
              </div>
              ${p.errors.payMethod ? `<div class="field-error">${esc(p.errors.payMethod)}</div>` : ""}
            </div>
            <div class="pay-box">
              <div style="font-weight:800;margin-bottom:6px;">${esc(t("payToAccount", { amount: fee }))}</div>
              <div style="font-size:13px;color:var(--text-muted);">${esc(pm.label)}</div>
              <div class="pay-account-row">
                <div>
                  <div style="font-size:12px;color:var(--text-muted);">${esc(t("accountNumber"))}</div>
                  <div style="font-size:17px;font-weight:800;">${esc(pm.number)}</div>
                </div>
                <button type="button" id="copyPayBtn" class="btn btn-sm">${esc(t("copyNumber"))}</button>
              </div>
              <div style="font-size:13px;">
                <span style="color:var(--text-muted);">${esc(t("accountHolder"))}:</span>
                <strong>${esc(pm.holder)}</strong>
              </div>
            </div>
            <div class="field-group">
              <label class="field-label"><span>${esc(t("payRefLabel"))}<span class="req">*</span></span></label>
              <input id="fPayRef" class="input" type="text" maxlength="60" value="${esc(p.payRef)}" placeholder="${esc(t("payRefPlaceholder"))}" />
              ${p.errors.payRef ? `<div class="field-error">${esc(p.errors.payRef)}</div>` : ""}
            </div>
            <div class="field-group">
              <label class="field-label"><span>${esc(t("receiptLabel"))}<span class="req">*</span></span></label>
              <label class="btn" style="width:100%;">
                🧾 ${esc(t("chooseReceipt"))}
                <input id="receiptPicker" type="file" accept="image/jpeg,image/png,image/webp" style="display:none;" />
              </label>
              ${
                p.receiptDataUrl
                  ? `<div style="margin-top:8px;">
                       <span class="neg-badge">${esc(t("receiptReady"))}</span>
                       <img src="${esc(p.receiptDataUrl)}" class="receipt-preview" alt="" />
                     </div>`
                  : ""
              }
              ${p.errors.receipt ? `<div class="field-error">${esc(p.errors.receipt)}</div>` : ""}
            </div>
          `;
        } else if (p.step === 6 && cat) {
          const fee = plans[p.plan] ?? 0;
          const cover = p.media.find((m) => m.type === "image");
          const attrRows = cat.fields
            .map((f) => {
              const v = formatFieldValue(p.cat, f, p.attrs[f.key]);
              if (!v) return "";
              return `<tr><th>${esc(lval(f.label))}</th><td>${esc(v)}</td></tr>`;
            })
            .join("");

          bodyHtml = `
            <h3 style="margin:0 0 12px;">${esc(t("step6Title"))}</h3>
            <div class="row-card" style="margin-bottom:12px;">
              <div class="row-main">
                <div class="row-thumb">
                  ${cover ? `<img src="${esc(cover.previewUrl)}" alt="" />` : esc(cat.emoji)}
                </div>
                <div class="row-info">
                  <span class="price-tag">${esc(formatPrice(Number(p.price || 0)))}</span>
                  ${p.negotiable ? `<span class="neg-badge" style="margin-left:6px;">${esc(t("negotiable"))}</span>` : ""}
                  <div class="row-title" style="margin-top:4px;">${esc(p.title)}</div>
                  <div class="row-sub">📍 ${esc(formatItemLocation({ region: p.region, city: p.city, place: p.place }))} · ${esc(lval(cat.label))}</div>
                </div>
              </div>
              <div class="detail-desc" style="margin-top:10px;margin-bottom:10px;">${esc(p.desc)}</div>
              <table class="details-table" style="margin-bottom:6px;">
                <tr><th>${esc(t("regionLabel"))}</th><td>${esc(getRegionLabel(p.region))}</td></tr>
                <tr><th>${esc(t("cityLabel"))}</th><td>${esc(p.city)}</td></tr>
                ${p.place.trim() ? `<tr><th>${esc(t("placeLabel"))}</th><td>${esc(p.place.trim())}</td></tr>` : ""}
                ${attrRows}
                <tr><th>Plan</th><td>${esc(p.plan)} (${esc(fee)} ${esc(t("birr"))})</td></tr>
                ${fee > 0 ? `<tr><th>Payment</th><td>${esc(p.payMethod)} · ${esc(p.payRef)}</td></tr>` : ""}
              </table>
            </div>
            <label class="check-pill" style="width:100%;margin-bottom:10px;">
              <input id="fConfirmLegal" type="checkbox"${p.confirmLegal ? " checked" : ""} />
              <span>${esc(t("confirmLegal"))}</span>
            </label>
            ${p.errors.confirmLegal ? `<div class="field-error">${esc(p.errors.confirmLegal)}</div>` : ""}
            ${p.errors.submit ? `<div class="field-error">${esc(p.errors.submit)}</div>` : ""}
          `;
        }

        const pct = Math.round((p.step / 6) * 100);
        return `
          <main class="content">
            <div class="wizard-card">
              <div class="wizard-top">
                <button type="button" id="postBackBtn" class="btn btn-sm">← ${esc(t("back"))}</button>
                <span class="step-label">${esc(t("stepOf", { step: p.step }))}</span>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
              ${bodyHtml}
              <div class="action-row" style="margin-top:16px;">
                ${
                  p.step < 6
                    ? `<button type="button" id="postNextBtn" class="btn btn-primary" style="width:100%;" ${nextDisabled ? "disabled" : ""}>${esc(t("next"))} →</button>`
                    : `<button type="button" id="postSubmitBtn" class="btn btn-primary" style="width:100%;" ${p.submitting ? "disabled" : ""}>${esc(p.submitting ? t("submitting") : t("submit"))}</button>`
                }
              </div>
            </div>
          </main>
        `;
      }

      function renderApp() {
        const root = document.getElementById("root");
        let mainHtml = "";
        if (state.view === "browse") mainHtml = renderBrowseView();
        else if (state.view === "saved") mainHtml = renderSavedView();
        else if (state.view === "mine") mainHtml = renderMineView();
        else if (state.view === "admin") mainHtml = renderAdminView();
        else if (state.view === "ai") mainHtml = renderAiView();
        else if (state.view === "post") mainHtml = renderPostView();

        root.innerHTML = `<div class="app-shell">${renderHeader()}${mainHtml}</div>`;
        bindEvents();

        if (state.view === "ai") {
          const log = document.getElementById("chatLog");
          if (log) log.scrollTop = log.scrollHeight;
        }
      }

      function openItemSheet(item, isAdminPreview = false) {
        const backdrop = document.getElementById("sheetBackdrop");
        const sheet = document.getElementById("sheetContent");
        const cats = state.config ? state.config.categories : {};
        const cat = cats[item.cat];
        const media = Array.isArray(item.media) ? item.media : [];
        const saved = isSaved(item.id);

        const slidesHtml = media.length
          ? media
              .map((m) => {
                if (m.type === "video") {
                  return `
                    <div class="gallery-slide">
                      <video controls playsinline muted preload="none" poster="${esc(cloudVideoPosterUrl(m.id))}">
                        <source src="${esc(cloudVideoUrl(m.id))}" type="video/mp4" />
                      </video>
                    </div>
                  `;
                }
                return `
                  <div class="gallery-slide">
                    <img src="${esc(cloudFullUrl(m.id))}" alt="${esc(item.title)}" loading="lazy" />
                  </div>
                `;
              })
              .join("")
          : `<div class="gallery-slide"><span style="font-size:64px;">${esc(cat ? cat.emoji : "📦")}</span></div>`;

        const attrs = item.attrs || {};
        const attrRows = cat
          ? cat.fields
              .map((f) => {
                const v = formatFieldValue(item.cat, f, attrs[f.key]);
                if (!v) return "";
                return `<tr><th>${esc(lval(f.label))}</th><td>${esc(v)}</td></tr>`;
              })
              .join("")
          : "";

        const locationRows = `
          ${item.region ? `<tr><th>${esc(t("regionLabel"))}</th><td>${esc(getRegionLabel(item.region))}</td></tr>` : ""}
          ${item.city ? `<tr><th>${esc(t("cityLabel"))}</th><td>${esc(item.city)}</td></tr>` : ""}
          ${item.place ? `<tr><th>${esc(t("placeLabel"))}</th><td>${esc(item.place)}</td></tr>` : ""}
        `;

        const cleanTg = String(item.tg || "").replace(/[^a-zA-Z0-9_]/g, "");
        const locSummary = formatItemLocation(item);

        sheet.innerHTML = `
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <span style="font-weight:700;font-size:13px;color:var(--text-muted);">
              ${esc(cat ? cat.emoji + " " + lval(cat.label) : item.cat)}
            </span>
            <button type="button" id="sheetCloseBtn" class="btn btn-sm">${esc(t("close"))}</button>
          </div>
          <div class="gallery-wrap">
            <div id="galleryTrack" class="gallery-track">${slidesHtml}</div>
            ${media.length > 1 ? `<div id="galleryCounter" class="gallery-count">1 / ${media.length}</div>` : ""}
          </div>
          <div class="detail-price-row">
            <span class="detail-price">${esc(formatPrice(item.price))}</span>
            ${item.negotiable ? `<span class="neg-badge">${esc(t("negotiable"))}</span>` : ""}
          </div>
          <h2 class="detail-title">${esc(item.title)}</h2>
          <div class="detail-place">📍 ${esc(locSummary || "-")}${cleanTg ? ` · @${esc(cleanTg)}` : ""}</div>
          <div class="detail-desc">${esc(item.desc)}</div>
          ${
            locationRows || attrRows
              ? `<h4 style="margin:0 0 6px;">${esc(t("detailsHeading"))}</h4>
                 <table class="details-table">${locationRows}${attrRows}</table>`
              : ""
          }
          <div class="translate-box">
            <div style="font-weight:700;font-size:13px;">🌐 ${esc(t("translateHeading"))}</div>
            <div class="translate-btns">
              <button type="button" class="btn btn-sm" data-tr-lang="en">English</button>
              <button type="button" class="btn btn-sm" data-tr-lang="om">Afaan Oromoo</button>
              <button type="button" class="btn btn-sm" data-tr-lang="am">አማርኛ</button>
            </div>
            <div id="translateOut" class="translate-result" style="display:none;"></div>
          </div>
          <div class="action-stack">
            ${
              cleanTg
                ? `<button type="button" id="msgSellerBtn" class="btn btn-primary" style="width:100%;">💬 ${esc(t("messageSeller"))} (@${esc(cleanTg)})</button>`
                : ""
            }
            <div class="action-row">
              ${
                !isAdminPreview
                  ? `<button type="button" id="sheetSaveBtn" class="btn">${esc(saved ? t("unsave") : t("save"))}</button>
                     <button type="button" id="sheetReportBtn" class="btn btn-danger">${esc(t("report"))}</button>`
                  : ""
              }
            </div>
          </div>
        `;

        backdrop.classList.add("open");
        backdrop.setAttribute("aria-hidden", "false");

        const track = document.getElementById("galleryTrack");
        const counter = document.getElementById("galleryCounter");
        if (track && counter && media.length > 1) {
          track.addEventListener("scroll", () => {
            const w = track.clientWidth || 1;
            const idx = Math.min(media.length, Math.max(1, Math.round(track.scrollLeft / w) + 1));
            counter.textContent = `${idx} / ${media.length}`;
          });
        }

        document.getElementById("sheetCloseBtn").addEventListener("click", closeSheet);

        if (cleanTg) {

      function compressImageFile(file, maxDim, quality) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error(t("errPhotoRead")));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error(t("errPhotoRead")));
            img.onload = () => {
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (!w || !h) return reject(new Error(t("errPhotoRead")));
              if (w > maxDim || h > maxDim) {
                if (w >= h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              canvas.toBlob(
                (blob) => {
                  if (!blob) return reject(new Error(t("errPhotoRead")));
                  resolve(blob);
                },
                "image/jpeg",
                quality
              );
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onerror = () => reject(new Error("Read failed"));
          r.onload = () => resolve(String(r.result || ""));
          r.readAsDataURL(blob);
        });
      }

      function getVideoDuration(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const video = document.createElement("video");
          video.preload = "metadata";
          video.muted = true;
          video.onloadedmetadata = () => {
            const dur = video.duration;
            URL.revokeObjectURL(url);
            resolve(dur);
          };
          video.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Could not read video metadata"));
          };
          video.src = url;
        });
      }

      function processUploadQueue() {
        const active = state.post.media.filter((m) => m.status === "uploading").length;
        const available = 2 - active;
        if (available <= 0) return;

        const queued = state.post.media.filter((m) => m.status === "queued").slice(0, available);
        for (const item of queued) {
          startSingleUpload(item);
        }
      }

      async function startSingleUpload(mediaItem) {
        mediaItem.status = "uploading";
        mediaItem.progress = 0;
        renderApp();

        try {
          const sign = await api("/api/upload-sign", {
            method: "POST",
            body: JSON.stringify({ type: mediaItem.type })
          });

          const form = new FormData();
          form.append("file", mediaItem.file);
          form.append("api_key", sign.api_key);
          form.append("timestamp", String(sign.timestamp));
          form.append("public_id", sign.public_id);
          form.append("allowed_formats", sign.allowed_formats);
          form.append("signature", sign.signature);

          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open(
              "POST",
              `https://api.cloudinary.com/v1_1/${encodeURIComponent(sign.cloud_name)}/${mediaItem.type}/upload`
            );
            xhr.upload.onprogress = (ev) => {
              if (ev.lengthComputable) {
                mediaItem.progress = Math.round((ev.loaded / ev.total) * 100);
                const el = document.querySelector(`[data-make-cover="${mediaItem.uid}"] .media-progress`);
                if (el) el.textContent = `${t("uploading")} ${mediaItem.progress}%`;
              }
            };
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve();
              } else {
                reject(new Error("Upload failed"));
              }
            };
            xhr.onerror = () => reject(new Error("Network error"));
            xhr.send(form);
          });

          mediaItem.id = sign.public_id;
          mediaItem.status = "done";
          mediaItem.progress = 100;
        } catch (e) {
          mediaItem.status = "error";
          mediaItem.errorText = e.message || "Upload failed";
          showToast(mediaItem.errorText);
        } finally {
          renderApp();
          processUploadQueue();
        }
      }

      async function handlePhotoFiles(files) {
        const existingPhotos = state.post.media.filter((m) => m.type === "image").length;
        const room = 6 - existingPhotos;
        if (room <= 0) {
          showToast(t("errPhotoMax"));
          return;
        }
        const slice = Array.from(files).slice(0, room);
        if (files.length > room) {
          showToast(t("errPhotoMax"));
        }

        for (const file of slice) {
          try {
            const blob = await compressImageFile(file, 1280, 0.8);
            if (blob.size > 10 * 1024 * 1024) {
              showToast(t("errPhotoBig"));
              continue;
            }
            const uid = "m_" + Math.random().toString(36).slice(2, 10);
            const previewUrl = URL.createObjectURL(blob);
            state.post.media.push({
              uid,
              type: "image",
              previewUrl,
              id: "",
              status: "queued",
              progress: 0,
              file: blob
            });
          } catch (e) {
            showToast(e.message || t("errPhotoRead"));
          }
        }
        renderApp();
        processUploadQueue();
      }

      async function handleVideoFile(file) {
        if (!file) return;
        const hasVid = state.post.media.some((m) => m.type === "video");
        if (hasVid) {
          showToast(t("errVideoOne"));
          return;
        }
        if (file.size > 30 * 1024 * 1024) {
          showToast(t("errVideoBig"));
          return;
        }
        try {
          const duration = await getVideoDuration(file);
          if (!Number.isFinite(duration) || duration > 10) {
            showToast(t("errVideoLong"));
            return;
          }
          const uid = "m_" + Math.random().toString(36).slice(2, 10);
          const previewUrl = URL.createObjectURL(file);
          state.post.media.push({
            uid,
            type: "video",
            previewUrl,
            id: "",
            status: "queued",
            progress: 0,
            file
          });
          renderApp();
          processUploadQueue();
        } catch (e) {
          showToast(e.message || t("errVideoLong"));
        }
      }

      function validateStep3() {
        const p = state.post;
        const cat = state.config.categories[p.cat];
        const errors = {};

        for (const f of cat.fields) {
          const v = p.attrs[f.key];
          if (f.type === "select") {
            if (f.required && !v) errors["attr_" + f.key] = t("reqErr");
          } else if (f.type === "multiselect") {
            if (f.required && (!Array.isArray(v) || v.length === 0)) {
              errors["attr_" + f.key] = t("reqErr");
            }
          } else if (f.type === "text") {
            const s = typeof v === "string" ? v.trim() : "";
            if (f.required && !s) errors["attr_" + f.key] = t("reqErr");
            else if (s && f.maxLength && s.length > f.maxLength) {
              errors["attr_" + f.key] = `Max ${f.maxLength}`;
            }
          } else if (f.type === "number") {
            if (v === undefined || v === null || v === "") {
              if (f.required) errors["attr_" + f.key] = t("reqErr");
            } else {
              const num = Number(v);
              if (!Number.isFinite(num) || (f.min !== undefined && num < f.min) || (f.max !== undefined && num > f.max)) {
                errors["attr_" + f.key] = `${f.min ?? 0} - ${f.max ?? ""}`;
              }
            }
          } else if (f.type === "date") {
            if (f.required && !v) errors["attr_" + f.key] = t("reqErr");
          }
        }

        if (!getRegionObj(p.region)) {
          errors.region = t("regionErr");
        }

        const city = p.city.trim();
        if (city.length < 2 || city.length > 40) {
          errors.city = t("cityErr");
        }

        const place = p.place.trim();
        if (place.length > 40) {
          errors.place = t("placeErr");
        }

        const title = p.title.trim();
        if (title.length < 3 || title.length > 60) errors.title = t("titleErr");

        const priceStr = String(p.price).trim();
        const priceNum = Number(priceStr);
        if (!priceStr || !Number.isInteger(priceNum) || priceNum < 0 || priceNum > 100000000) {
          errors.price = t("priceErr");
        }

        const desc = p.desc.trim();
        if (desc.length < 10 || desc.length > 300) errors.desc = t("descErr");

        p.errors = errors;
        return Object.keys(errors).length === 0;
      }

      function validateStep5() {
        const p = state.post;
        const errors = {};
        if (p.payMethod !== "CBE" && p.payMethod !== "Telebirr") {

        if (p.payRef.trim().length < 3) {

        }
        p.errors = errors;
        return Object.keys(errors).length === 0;
      }

        const p = state.post;

        p.errors = {};
        p.submitting = true;
        renderApp();

        try {

          const payload = {
            cat: p.cat,
            region: p.region,
            city: p.city.trim(),
            place: p.place.trim(),
            title: p.title.trim(),
            price: Number(p.price),
            negotiable: Boolean(p.negotiable),

            media: p.media
              .filter((m) => m.status === "done" && m.id)
              .map((m) => ({ type: m.type, id: m.id })),
            plan: p.plan,
            pay:

      function validateAndCollectSettingsDraft() {
        const s = state.settingsDraft;
        if (!s) return null;
        const std = Number(s.plans.standard);
        const feat = Number(s.plans.featured);
        if (!Number.isInteger(std) || std < 0 || std > 100000 || !Number.isInteger(feat) || feat < 0 || feat > 100000) {
          state.settingsError = t("settingsErrFee");
          return null;
        }
        const cbe = {
          label: String(s.payment.CBE.label || "").trim(),
          number: String(s.payment.CBE.number || "").trim(),
          holder: String(s.payment.CBE.holder || "").trim()
        };
        const tb = {
          label: String(s.payment.Telebirr.label || "").trim(),
          number: String(s.payment.Telebirr.number || "").trim(),
          holder: String(s.payment.Telebirr.holder || "").trim()
        };
        for (const pm of [cbe, tb]) {
          if (!pm.label || pm.label.length > 60 || !pm.number || pm.number.length > 40 || !pm.holder || pm.holder.length > 60) {
            state.settingsError = t("settingsErrPay");
            return null;
          }
        }
        const mp = Number(s.limits.max_pending);
        const ai = Number(s.limits.ai_daily);
        const up = Number(s.limits.upload_daily);
        if (
          !Number.isInteger(mp) || mp < 1 || mp > 1000 ||
          !Number.isInteger(ai) || ai < 1 || ai > 1000 ||
          !Number.isInteger(up) || up < 1 || up > 1000
        ) {
          state.settingsError = t("settingsErrLimit");
          return null;
        }
        state.settingsError = "";
        return {
          plans: { free: 0, standard: std, featured: feat },
          payment: { CBE: cbe, Telebirr: tb },
          limits: { max_pending: mp, ai_daily: ai, upload_daily: up }
        };
      }

            const pos = e.target.selectionStart;
