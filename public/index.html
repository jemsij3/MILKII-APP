            renderApp();
            const again = document.getElementById("searchInput");
            if (again) {
              again.focus();
              try { again.setSelectionRange(pos, pos); } catch {}
            }
          });
        }

        const clearSearchBtn = document.getElementById("clearSearchBtn");
        if (clearSearchBtn) {
          clearSearchBtn.addEventListener("click", () => {
            state.search = "";
            renderApp();
          });
        }

        const regionFilter = document.getElementById("regionFilter");
        if (regionFilter) {
          regionFilter.addEventListener("change", (e) => {
            state.regionFilter = e.target.value;
            localStorage.setItem("milkii_region", state.regionFilter);
            loadBrowseItems();
          });
        }

        const cityFilter = document.getElementById("cityFilter");
        if (cityFilter) {
          cityFilter.addEventListener("input", (e) => {
            const pos = e.target.selectionStart;
            state.cityFilter = e.target.value;
            renderApp();
            const again = document.getElementById("cityFilter");
            if (again) {
              again.focus();
              try { again.setSelectionRange(pos, pos); } catch {}
            }
          });
        }

        document.querySelectorAll("[data-cat]").forEach((chip) => {
          chip.addEventListener("click", () => {
            state.catFilter = chip.getAttribute("data-cat");
            renderApp();
          });
        });

        document.querySelectorAll("[data-open-item]").forEach((card) => {
          card.addEventListener("click", () => {
            const id = Number(card.getAttribute("data-open-item"));
            const item =
              state.items.find((x) => x.id === id) ||
              state.saved.find((x) => x.id === id);
            if (item) openItemSheet(item, false);
          });
        });

        const startPostBtn = document.getElementById("startPostBtn");
        if (startPostBtn) {
          startPostBtn.addEventListener("click", () => {
            if (!state.me || !state.me.username) {
              showToast(t("noTgUsername"));
              return;
            }
            state.post = createEmptyPost();
            state.view = "post";
            renderApp();
          });
        }

        document.querySelectorAll("[data-mine-sold]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-mine-sold"));
            openConfirmDialog(t("confirmSold"), async () => {
              try {
                await api(`/api/items/${id}/sold`, { method: "POST" });
                loadMineItems();
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        document.querySelectorAll("[data-mine-delete]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-mine-delete"));
            openConfirmDialog(t("confirmDelete"), async () => {
              try {
                await api(`/api/items/${id}/delete`, { method: "POST" });
                loadMineItems();
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        document.querySelectorAll("[data-admin-section]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.adminSection = btn.getAttribute("data-admin-section");
            loadCurrentAdminSection();
          });
        });

        document.querySelectorAll("[data-admin-tab]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.adminTab = btn.getAttribute("data-admin-tab");
            loadAdminItems();
          });
        });

        document.querySelectorAll("[data-admin-view]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-admin-view"));
            const it = state.adminItems.find((x) => x.id === id);
            if (it) openItemSheet(it, true);
          });
        });

        document.querySelectorAll("[data-admin-receipt]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-admin-receipt"));
            openReceiptDialog(id);
          });
        });

        document.querySelectorAll("[data-admin-approve]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = Number(btn.getAttribute("data-admin-approve"));
            try {
              await api(`/api/admin/items/${id}/approve`, { method: "POST" });
              loadAdminItems();
            } catch (e) {
              showToast(e.message);
            }
          });
        });

        document.querySelectorAll("[data-admin-reject]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-admin-reject"));
            openRejectDialog(async (reason) => {
              try {
                await api(`/api/admin/items/${id}/reject`, {
                  method: "POST",
                  body: JSON.stringify({ reason })
                });
                loadAdminItems();
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        document.querySelectorAll("[data-admin-ban]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-admin-ban"));
            openBanDialog(async (reason) => {
              try {
                await api(`/api/admin/items/${id}/ban`, {
                  method: "POST",
                  body: JSON.stringify({ reason })
                });
                showToast(t("bannedOk"));
                loadAdminItems();
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        document.querySelectorAll("[data-admin-delete]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = Number(btn.getAttribute("data-admin-delete"));
            openConfirmDialog(t("confirmDelete"), async () => {
              try {
                await api(`/api/items/${id}/delete`, { method: "POST" });
                loadAdminItems();
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        const usersSearchInput = document.getElementById("usersSearchInput");
        if (usersSearchInput) {
          usersSearchInput.addEventListener("input", (e) => {
            const pos = e.target.selectionStart;
            state.usersQuery = e.target.value;
            clearTimeout(window.__usersSearchTimer);
            window.__usersSearchTimer = setTimeout(() => {
              loadAdminUsers(false).then(() => {
                const again = document.getElementById("usersSearchInput");
                if (again) {
                  again.focus();
                  try { again.setSelectionRange(pos, pos); } catch {}
                }
              });
            }, 250);
          });
        }

        const clearUsersSearchBtn = document.getElementById("clearUsersSearchBtn");
        if (clearUsersSearchBtn) {
          clearUsersSearchBtn.addEventListener("click", () => {
            state.usersQuery = "";
            loadAdminUsers(false);
          });
        }

        document.querySelectorAll("[data-users-filter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.usersFilter = btn.getAttribute("data-users-filter");
            loadAdminUsers(false);
          });
        });

        document.querySelectorAll("[data-user-ban]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const uid = btn.getAttribute("data-user-ban");
            openBanDialog(async (reason) => {
              try {
                await api(`/api/admin/users/${encodeURIComponent(uid)}/ban`, {
                  method: "POST",
                  body: JSON.stringify({ reason })
                });
                showToast(t("bannedOk"));
                loadAdminUsers(false);
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        document.querySelectorAll("[data-user-unban]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const uid = btn.getAttribute("data-user-unban");
            openConfirmDialog(t("confirmUnban"), async () => {
              try {
                await api(`/api/admin/users/${encodeURIComponent(uid)}/unban`, { method: "POST" });
                showToast(t("unbannedOk"));
                loadAdminUsers(false);
              } catch (e) {
                showToast(e.message);
              }
            });
          });
        });

        const usersLoadMoreBtn = document.getElementById("usersLoadMoreBtn");
        if (usersLoadMoreBtn) {
          usersLoadMoreBtn.addEventListener("click", () => loadAdminUsers(true));
        }

        document.querySelectorAll("[data-analytics-days]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.analyticsDays = Number(btn.getAttribute("data-analytics-days")) || 30;
            loadAdminAnalytics();
          });
        });

        const auditLoadMoreBtn = document.getElementById("auditLoadMoreBtn");
        if (auditLoadMoreBtn) {
          auditLoadMoreBtn.addEventListener("click", () => loadAdminAudit(true));
        }

        if (state.settingsDraft) {
          const bindSetInput = (id, setter) => {
            const el = document.getElementById(id);
            if (el) el.addEventListener("input", () => setter(el.value));
          };
          bindSetInput("setPlanStandard", (v) => { state.settingsDraft.plans.standard = v; });
          bindSetInput("setPlanFeatured", (v) => { state.settingsDraft.plans.featured = v; });
          bindSetInput("setCbeLabel", (v) => { state.settingsDraft.payment.CBE.label = v; });
          bindSetInput("setCbeNumber", (v) => { state.settingsDraft.payment.CBE.number = v; });
          bindSetInput("setCbeHolder", (v) => { state.settingsDraft.payment.CBE.holder = v; });
          bindSetInput("setTbLabel", (v) => { state.settingsDraft.payment.Telebirr.label = v; });
          bindSetInput("setTbNumber", (v) => { state.settingsDraft.payment.Telebirr.number = v; });
          bindSetInput("setTbHolder", (v) => { state.settingsDraft.payment.Telebirr.holder = v; });
          bindSetInput("setLimPending", (v) => { state.settingsDraft.limits.max_pending = v; });
          bindSetInput("setLimAi", (v) => { state.settingsDraft.limits.ai_daily = v; });
          bindSetInput("setLimUpload", (v) => { state.settingsDraft.limits.upload_daily = v; });
        }

        const saveSettingsBtn = document.getElementById("saveSettingsBtn");
        if (saveSettingsBtn) {
          saveSettingsBtn.addEventListener("click", () => {
            const payload = validateAndCollectSettingsDraft();
            if (!payload) {
              renderApp();
              return;
            }
            openPromptDialog(t("settingsSaveConfirm"), t("confirm"), async () => {
              state.settingsSaving = true;
              renderApp();
              try {
                const saved = await api("/api/admin/settings", {
                  method: "PUT",
                  body: JSON.stringify(payload)
                });
                state.settingsDraft = JSON.parse(JSON.stringify(saved));
                state.config = await api("/api/config");
                state.settingsError = "";
                showToast(t("settingsSavedOk"));
              } catch (e) {
                state.settingsError = e.message;
                showToast(e.message);
              } finally {
                state.settingsSaving = false;
                renderApp();
              }
            });
          });
        }

        const aiForm = document.getElementById("aiForm");
        if (aiForm) {
          aiForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (state.aiBusy) return;
            const input = document.getElementById("aiInput");
            const text = input.value.trim();
            if (!text) return;
            state.aiMessages.push({ role: "user", content: text });
            state.aiBusy = true;
            renderApp();
            try {
              const res = await api("/api/ai", {
                method: "POST",
                body: JSON.stringify({ task: "chat", messages: state.aiMessages })
              });
              state.aiMessages.push({ role: "assistant", content: res.text });
            } catch (err) {
              state.aiMessages.push({ role: "assistant", content: err.message });
            } finally {
              state.aiBusy = false;
              renderApp();
            }
          });
        }

        const postDoneBtn = document.getElementById("postDoneBtn");
        if (postDoneBtn) {
          postDoneBtn.addEventListener("click", () => {
            state.view = "mine";
            loadMineItems();
          });
        }

        const postBackBtn = document.getElementById("postBackBtn");
        if (postBackBtn) {
          postBackBtn.addEventListener("click", () => {
            const p = state.post;
            if (p.step === 1) {
              state.view = "browse";
            } else if (p.step === 6 && p.plan === "free") {
              p.step = 4;
            } else {
              p.step -= 1;
            }
            p.errors = {};
            renderApp();
          });
        }

        const postNextBtn = document.getElementById("postNextBtn");
        if (postNextBtn) {
          postNextBtn.addEventListener("click", () => {
            const p = state.post;
            if (p.step === 1) {
              if (!p.cat) return;
              p.step = 2;
            } else if (p.step === 2) {
              const hasBusy = p.media.some((m) => m.status === "queued" || m.status === "uploading");
              const hasErr = p.media.some((m) => m.status === "error");
              const donePhotos = p.media.filter((m) => m.type === "image" && m.status === "done").length;
              if (hasBusy || hasErr || donePhotos < 1) {
                showToast(hasBusy || hasErr ? t("errWaitUploads") : t("errNeedPhoto"));
                return;
              }
              p.step = 3;
            } else if (p.step === 3) {
              if (!validateStep3()) {
                renderApp();
                return;
              }
              p.step = 4;
            } else if (p.step === 4) {
              p.step = p.plan === "free" ? 6 : 5;
            } else if (p.step === 5) {
              if (!validateStep5()) {
                renderApp();
                return;
              }
              p.step = 6;
            }
            renderApp();
          });
        }

        const postSubmitBtn = document.getElementById("postSubmitBtn");
        if (postSubmitBtn) {
          postSubmitBtn.addEventListener("click", submitListing);
        }

        document.querySelectorAll("[data-pick-cat]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const newCat = btn.getAttribute("data-pick-cat");
            if (state.post.cat !== newCat) {
              state.post.cat = newCat;
              state.post.attrs = {};
              state.post.errors = {};
            }
            renderApp();
          });
        });

        const photoPicker = document.getElementById("photoPicker");
        if (photoPicker) {
          photoPicker.addEventListener("change", (e) => {
            if (e.target.files && e.target.files.length) {
              handlePhotoFiles(e.target.files);
            }
          });
        }

        const videoPicker = document.getElementById("videoPicker");
        if (videoPicker) {
          videoPicker.addEventListener("change", (e) => {
            if (e.target.files && e.target.files[0]) {
              handleVideoFile(e.target.files[0]);
            }
          });
        }

        document.querySelectorAll("[data-remove-media]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const uid = btn.getAttribute("data-remove-media");
            const idx = state.post.media.findIndex((m) => m.uid === uid);
            if (idx >= 0) {
              const removed = state.post.media[idx];
              if (removed.previewUrl) URL.revokeObjectURL(removed.previewUrl);
              state.post.media.splice(idx, 1);
              renderApp();
              processUploadQueue();
            }
          });
        });

        document.querySelectorAll("[data-retry-media]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const uid = btn.getAttribute("data-retry-media");
            const item = state.post.media.find((m) => m.uid === uid);
            if (item) {
              item.status = "queued";
              item.progress = 0;
              renderApp();
              processUploadQueue();
            }
          });
        });

        document.querySelectorAll("[data-make-cover]").forEach((tile) => {
          tile.addEventListener("click", () => {
            const uid = tile.getAttribute("data-make-cover");
            const idx = state.post.media.findIndex((m) => m.uid === uid);
            if (idx > 0 && state.post.media[idx].type === "image") {
              const [chosen] = state.post.media.splice(idx, 1);
              state.post.media.unshift(chosen);
              renderApp();
            }
          });
        });

        document.querySelectorAll("[data-attr-input]").forEach((el) => {
          const evName = el.tagName === "SELECT" || el.type === "date" ? "change" : "input";
          el.addEventListener(evName, () => {
            const key = el.getAttribute("data-attr-input");
            state.post.attrs[key] = el.value;
            const countSpan = el.parentElement.querySelector(".char-count");
            const max = el.getAttribute("maxlength");
            if (countSpan && max) {
              countSpan.textContent = `${el.value.length}/${max}`;
            }
          });
        });

        document.querySelectorAll("[data-attr-multi]").forEach((cb) => {
          cb.addEventListener("change", () => {
            const key = cb.getAttribute("data-attr-multi");
            const arr = Array.isArray(state.post.attrs[key]) ? state.post.attrs[key] : [];
            if (cb.checked) {
              if (!arr.includes(cb.value)) arr.push(cb.value);
            } else {
              const idx = arr.indexOf(cb.value);
              if (idx >= 0) arr.splice(idx, 1);
            }
            state.post.attrs[key] = arr;
          });
        });

        const fRegion = document.getElementById("fRegion");
        if (fRegion) {
          fRegion.addEventListener("change", (e) => {
            state.post.region = e.target.value;
            if (state.post.errors.region) delete state.post.errors.region;
            renderApp();
          });
        }

        const fCity = document.getElementById("fCity");
        if (fCity) {
          fCity.addEventListener("input", () => {
            state.post.city = fCity.value;
            const c = document.getElementById("cityCount");
            if (c) c.textContent = `${fCity.value.length}/40`;
          });
        }

        document.querySelectorAll("[data-pick-city]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.post.city = btn.getAttribute("data-pick-city");
            renderApp();
          });
        });

        const fPlace = document.getElementById("fPlace");
        if (fPlace) {
          fPlace.addEventListener("input", () => {
            state.post.place = fPlace.value;
            const c = document.getElementById("placeCount");
            if (c) c.textContent = `${fPlace.value.length}/40`;
          });
        }

        const fTitle = document.getElementById("fTitle");
        if (fTitle) {
          fTitle.addEventListener("input", () => {
            state.post.title = fTitle.value;
            const c = document.getElementById("titleCount");
            if (c) c.textContent = `${fTitle.value.length}/60`;
          });
        }

        const fPrice = document.getElementById("fPrice");
        if (fPrice) {
          fPrice.addEventListener("input", () => {
            state.post.price = fPrice.value;
          });
        }

        const fNeg = document.getElementById("fNegotiable");
        if (fNeg) {
          fNeg.addEventListener("change", () => {
            state.post.negotiable = fNeg.checked;
          });
        }

        const fDesc = document.getElementById("fDesc");
        if (fDesc) {
          fDesc.addEventListener("input", () => {
            state.post.desc = fDesc.value;
            const c = document.getElementById("descCount");
            if (c) c.textContent = `${fDesc.value.length}/300`;
          });
        }

        document.querySelectorAll("[data-pick-plan]").forEach((card) => {
          card.addEventListener("click", () => {
            state.post.plan = card.getAttribute("data-pick-plan");
            renderApp();
          });
        });

        document.querySelectorAll("[data-pay-method]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.post.payMethod = btn.getAttribute("data-pay-method");
            renderApp();
          });
        });

        const copyPayBtn = document.getElementById("copyPayBtn");
        if (copyPayBtn) {
          copyPayBtn.addEventListener("click", async () => {
            const payCfg = (state.config && state.config.payment) || {};
            const pm = payCfg[state.post.payMethod] || payCfg.CBE || { number: "" };
            if (!pm.number) return;
            try {
              await navigator.clipboard.writeText(pm.number);
              showToast(t("copied"));
            } catch {
              showToast(pm.number);
            }
          });
        }

        const fPayRef = document.getElementById("fPayRef");
        if (fPayRef) {
          fPayRef.addEventListener("input", () => {
            state.post.payRef = fPayRef.value;
          });
        }

        const receiptPicker = document.getElementById("receiptPicker");
        if (receiptPicker) {
          receiptPicker.addEventListener("change", async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
              const blob = await compressImageFile(file, 900, 0.7);
              const dataUrl = await blobToDataUrl(blob);
              if (dataUrl.length >= 700000) {
                showToast(t("errPhotoBig"));
                return;
              }
              state.post.receiptDataUrl = dataUrl;
              renderApp();
            } catch (err) {
              showToast(err.message || t("errPhotoRead"));
            }
          });
        }

        const fConfirmLegal = document.getElementById("fConfirmLegal");
        if (fConfirmLegal) {
          fConfirmLegal.addEventListener("change", () => {
            state.post.confirmLegal = fConfirmLegal.checked;
          });
        }
      }

      async function boot() {
        document.getElementById("root").innerHTML = `<div class="gate-message">${esc(t("loading"))}</div>`;
        try {
          const [cfg, me] = await Promise.all([api("/api/config"), api("/api/me")]);
          state.config = cfg;
          state.me = me;
          if (state.regionFilter && !getRegionObj(state.regionFilter)) {
            state.regionFilter = "";
            localStorage.removeItem("milkii_region");
          }
          await loadBrowseItems();

          const canAskWrite =
            me &&
            !me.canDm &&
            !localStorage.getItem("milkii_asked_write") &&
            tg &&
            typeof tg.requestWriteAccess === "function";
          if (canAskWrite) {
            localStorage.setItem("milkii_asked_write", "1");
            openPromptDialog(t("allowDmPrompt"), t("allowBtn"), () => {
              try {
                tg.requestWriteAccess();
              } catch {}
            });
          }
        } catch (e) {
          document.getElementById("root").innerHTML = `<div class="gate-message">${esc(e.message)}</div>`;
        }
      }

      boot();
    }
  </script>
</body>
</html>
